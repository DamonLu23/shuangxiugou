name: data-refresh
on:
  schedule:
    - cron: '30 20 * * 0'        # 每周日 20:30 UTC
  workflow_dispatch:
    inputs:
      full:
        description: '全量采集（默认按周分片 1/4）'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run collection pipeline
        run: |
          cd crawler
          if [ "${{ inputs.full }}" = "true" ]; then
            echo "全量采集（手动触发）"
            python -u pipeline.py || echo "pipeline 部分失败，继续导出已有数据"
          else
            CHUNK=$(( 10#$(date +%V) % 4 + 1 ))
            echo "本周分片: ${CHUNK}/4（4 周覆盖全池；手动触发可勾选 full 全量）"
            python -u pipeline.py --chunk ${CHUNK}/4 || echo "pipeline 部分失败，继续导出已有数据"
          fi

      - name: Import seed brands (companies/brands → DB)
        run: |
          cd crawler
          python import_seed.py

      - name: Collect whitelist jobs
        run: |
          cd crawler
          python -u collect_jobs.py || echo "岗位采集部分失败，继续导出已有数据"

      - name: Verify data
        run: |
          cd crawler
          python verify.py || echo "verify 有未达标项，数据仍导出供人工检查"

      - name: Export open-source artifacts
        run: |
          cd backend
          python scripts/export_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild local bundle (clone-and-use)
        run: |
          cd web
          npm install --prefer-offline
          npm run local

      - name: Compose PR body (source health reports)
        run: |
          mkdir -p data/local
          { cat data/source_health.md 2>/dev/null || echo "（证据源报告缺失）"; echo; \
            cat data/source_health_jobs.md 2>/dev/null || echo "（岗位源报告缺失）"; } \
            > data/local/pr_body.md

      - name: Open data PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): 每周数据刷新'
          branch: data-refresh
          delete-branch: true
          title: '数据周更（自动生成）'
          body-path: data/local/pr_body.md