name: ci
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r backend/requirements.txt pytest
      - name: Backend tests
        run: cd backend && python -m pytest tests -q

  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r backend/requirements.txt playwright pytest
      - name: Crawler tests
        run: cd crawler && python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: cd web && npm install --prefer-offline
      - name: Web tests
        run: cd web && npm test
      - name: Build SPA
        run: cd web && npm run build
      - name: Build local bundle
        run: cd web && npm run local